<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Cronista</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/check.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="kicker">Temporada 1 · En preparación</p>
        <h1>Cronista</h1>
        <p class="lead">La crónica todavía se está escribiendo. Vuelve pronto.</p>
      </header>

      <section aria-labelledby="check-title">
        <h2 id="check-title">Probar conexión</h2>
        <p>
          Entra con la cuenta de Google con la que juegas y comprueba que el servidor te reconoce.
          No se guarda nada.
        </p>
        <button type="button" id="sign-in">Entrar con Google y probar</button>
        <p id="status" role="status"></p>
        <ul id="results"></ul>
      </section>
    </main>
  </body>
</html>
