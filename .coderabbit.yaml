# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews every PR (free for public repos). It never blocks merges: neither its commit status nor
# its threads are required by the ruleset. Its comments are advisory (see docs/delivery.md).
language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  commit_status: true
  fail_commit_status: false
  auto_review:
    enabled: true
    drafts: false
  pre_merge_checks:
    title:
      mode: warning
      requirements: >-
        Follow the commit convention in .claude/rules/workflow.md, because the PR title becomes the squash commit on
        master: `<gitmoji> <type>(<scope>): <description>` (scope optional) in English, with the gitmoji of the type
        (✨ feat, 🐛 fix, 📝 docs, 🎨 style, ♻️ refactor, ⚡️ perf, ✅ test, 📦️ build, 👷 ci, 🔧 chore, ⏪️ revert),
        a lower-case imperative description without a final period, and at most 66 characters.
  path_filters:
    - '!pnpm-lock.yaml'
    - '!**/database.types.ts'
    - '!**/dist/**'
    - '!**/.turbo/**'
    - '!**/*.snap'
  path_instructions:
    # Pointers only: the rules themselves live in the guideline files listed under knowledge_base.
    - path: '**/*'
      instructions: >-
        Public repository: apply "Secrets and player data" in AGENTS.md, .claude/rules/code-style.md and the language
        rules in .claude/rules/workflow.md. Do not ask to harden the hooks or permission rules in .claude/ against
        deliberately obfuscated commands: they are tripwires against mistakes, not a security boundary.
    - path: 'packages/db/**'
      instructions: Apply .claude/rules/database.md.
    - path: '{packages/narrator,evals}/**'
      instructions: Apply .claude/rules/narrator.md.
    - path: '{infra,services}/**'
      instructions: Apply .claude/rules/infra.md.
    - path: '.github/**'
      instructions: Apply "Public repo security" and the deploy freeze in docs/delivery.md.

knowledge_base:
  code_guidelines:
    enabled: true
    # Supplements the default patterns (CLAUDE.md, .cursorrules...): AGENTS.md is the repo's agent guide.
    filePatterns:
      - '**/AGENTS.md'
      - '.claude/rules/*.md'
      - 'docs/*.md'

chat:
  auto_reply: true
