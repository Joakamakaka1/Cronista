# Dumps the production database, checks that the dump restores and encrypts it for the owner (see
# docs/delivery.md). Runs in a `production` job, after `setup-supabase-cli`; `store-backup` uploads
# the result from a job with no environment, because the backups role trusts the branch, not the
# environment.
name: Dump the database
description: Dumps roles, schema and data with the Supabase CLI, restores them into a throwaway Postgres, encrypts them with age and hands them on as an artifact.

inputs:
  access-token:
    description: Scoped Supabase access token of the production project.
    required: true
  project-ref:
    description: Ref of the production project.
    required: true

outputs:
  artifact:
    description: Name of the artifact that holds the encrypted dump.
    value: database-backup
  restore-check:
    description: Whether the dump restored and its row counts match production (`passed` or `failed`).
    value: ${{ steps.restore-check.outputs.result }}

runs:
  using: composite
  steps:
    - name: Install age (pinned checksum)
      shell: bash
      env:
        AGE_VERSION: 1.3.2
        # SHA-256 of age-v<version>-linux-amd64.tar.gz; update both together.
        AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
      run: |
        tarball="age-v${AGE_VERSION}-linux-amd64.tar.gz"
        cd "$RUNNER_TEMP"
        curl -fsSLO "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/$tarball"
        echo "${AGE_SHA256}  $tarball" | sha256sum --check
        tar -xzf "$tarball" age/age
        echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

    # The token signs in as Supabase's temporary login role, through the pooler. Three parts, as
    # Supabase's backup guide does, so a restore can replay them in order. The row counts come from
    # the Management API's read-only query, before and after the data: a write in between must not
    # fail the check. A count that cannot be read fails the check, never the dump.
    - name: Dump the database
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        SUPABASE_PROJECT_REF: ${{ inputs.project-ref }}
      run: |
        umask 077
        dir="$RUNNER_TEMP/backup"
        mkdir -p "$dir"
        dump() { supabase db dump --project-ref "$SUPABASE_PROJECT_REF" --workdir packages/db "$@"; }
        counts() {
          jq -n --rawfile query "$GITHUB_ACTION_PATH/table-counts.sql" '{query: $query}' \
            | curl -fsS --max-time 60 -X POST --data-binary @- \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'content-type: application/json' \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only" \
            | jq -r '.[] | [.name, .count] | @tsv' > "$1" \
            || echo "::warning::Could not read the row counts of production."
        }
        dump --role-only -f "$dir/roles.sql"
        dump -f "$dir/schema.sql"
        counts "$RUNNER_TEMP/counts-before.tsv"
        dump --data-only --use-copy -x storage.buckets_vectors -x storage.vector_indexes \
          -f "$dir/data.sql"
        counts "$RUNNER_TEMP/counts-after.tsv"
        for part in roles schema data; do
          test -s "$dir/$part.sql"
        done

    # With no token: the plain text is on this runner anyway, and it needs no key. A failure here
    # still encrypts the dump, because a dump that did not restore may be the best copy there is;
    # `store-backup` fails the run after uploading it.
    - name: Check that the dump restores
      id: restore-check
      shell: bash
      run: |
        umask 077
        if bash "$GITHUB_ACTION_PATH/restore-check.sh" "$RUNNER_TEMP/backup" \
          "$RUNNER_TEMP/counts-before.tsv" "$RUNNER_TEMP/counts-after.tsv"; then
          echo 'result=passed' >> "$GITHUB_OUTPUT"
        else
          echo '::error::The dump did not restore, or its row counts do not match production.'
          echo 'result=failed' >> "$GITHUB_OUTPUT"
        fi

    - name: Encrypt the dump
      shell: bash
      env:
        RECIPIENTS: ${{ github.workspace }}/.github/backup-recipients.txt
      run: |
        umask 077
        dir="$RUNNER_TEMP/backup"
        for part in roles schema data; do
          age --encrypt -R "$RECIPIENTS" -o "$dir/$part.sql.age" "$dir/$part.sql"
          rm "$dir/$part.sql"
        done
        ls -l "$dir"

    # Only ciphertext leaves the job. Artifacts of a public repo are visible to signed-in users, so
    # it lives one day: long enough for `store-backup`.
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: database-backup
        path: ${{ runner.temp }}/backup/*.sql.age
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
        overwrite: true
