# Publishes the GitHub Release of a version once it reaches production (see docs/delivery.md). Both
# deploy workflows run it, so the first one to ship a version creates its release. Needs a job with
# `contents: write`.
name: Release the version
description: Creates the tag and the GitHub Release of a version on its deployed commit, unless they exist.

inputs:
  version:
    description: Root `package.json` version of the deployed commit.
    required: true
  sha:
    description: The deployed commit.
    required: true

runs:
  using: composite
  steps:
    - name: Release the version if it is new
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: v${{ inputs.version }}
        SHA: ${{ inputs.sha }}
      run: |
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "$TAG is already released."
          exit 0
        fi
        # The other deploy workflow may release it in between.
        gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes \
          || gh release view "$TAG" > /dev/null
        echo "Released $TAG." | tee -a "$GITHUB_STEP_SUMMARY"
