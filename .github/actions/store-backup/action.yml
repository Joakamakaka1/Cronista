# Uploads the encrypted dump of `dump-database` to the data bucket (see docs/delivery.md). Runs in a
# job with no environment and `id-token: write`: `cronista-github-backups` trusts the master branch
# `sub`, and can only add objects under `backups/`.
name: Store the database backup
description: Uploads the encrypted dump to backups/ in the data bucket with the write-only backups role.

inputs:
  artifact:
    description: Name of the artifact from `dump-database`.
    required: true
  reason:
    description: Why the dump was taken (`nightly` or `pre-migration`); part of the object keys.
    required: true
  aws-account-id:
    description: AWS account ID, which builds the role ARN; GitHub masks it in the logs.
    required: true
  bucket:
    description: Name of the data bucket of CronistaGitHubAccess.
    required: true
  restore-check:
    description: Result of the restore check of `dump-database`. Anything but `passed` fails the run, after the upload.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/backup

    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/cronista-github-backups
        aws-region: eu-west-1
        mask-aws-account-id: true

    # One folder per dump. The role can neither list nor read, so a later run never overwrites one;
    # versioning would keep it anyway.
    - name: Upload the dump
      shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
        REASON: ${{ inputs.reason }}
      run: |
        prefix="backups/$(date -u +%Y-%m-%dT%H%M%SZ)-${REASON}-${GITHUB_RUN_ID}"
        for part in roles schema data; do
          aws s3 cp --no-progress "$RUNNER_TEMP/backup/$part.sql.age" "s3://$BUCKET/$prefix/$part.sql.age"
        done
        echo "Stored under $prefix/"

    # After the upload: a dump that did not restore may be the best copy there is. This fails the run,
    # which emails the owner, and in deploy.yml it stops the migrations and the stacks.
    - name: Fail the run if the dump did not restore
      shell: bash
      env:
        RESTORE_CHECK: ${{ inputs.restore-check }}
      run: |
        if [ "$RESTORE_CHECK" != passed ]; then
          echo '::error::The restore check of this dump failed (see the dump job). The dump is stored anyway.'
          exit 1
        fi
