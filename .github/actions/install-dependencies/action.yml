# Installs a workspace's dependencies with the pnpm and Node versions it pins (see docs/delivery.md).
# The deploy jobs point it at the target in `target/`, which may be an older version than the
# workflow's own commit.
name: Install the dependencies
description: Sets up the workspace's pinned pnpm and Node, with the pnpm store cached, and runs `pnpm install --frozen-lockfile`.

inputs:
  directory:
    description: Root of the workspace, relative to the repository root.
    default: .
  filter:
    description: Installs only this package and its dependencies (`pnpm install --filter`).
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.directory }}/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.directory }}/.node-version
        cache: pnpm
        cache-dependency-path: ${{ inputs.directory }}/pnpm-lock.yaml
    - name: Install the dependencies
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        FILTER: ${{ inputs.filter }}
      run: pnpm install --frozen-lockfile ${FILTER:+--filter "$FILTER"}
