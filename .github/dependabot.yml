version: 2
updates:
  # Keeps SHA-pinned actions current. npm dependencies are updated by hand (AI SDK only if evals pass).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Dependabot adds ": " after the prefix, giving "👷 ci: bump …", which passes the pr-title check
      prefix: 👷 ci
