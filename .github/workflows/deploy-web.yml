# Deploys the front on every merge that changes it (see docs/delivery.md): syncs the site into the
# bucket of CronistaEdge and checks that CloudFront serves it, with no approval. Dispatching an older
# tag redeploys that version of the site.
# Public repo: the account ID is a secret, so GitHub masks it, and the bucket name is masked too.
name: Deploy web

on:
  push:
    branches: [master]
    # The app's own code, and what its bundle is built from: shared rules and schemas, the database
    # types, the Supabase URL, the version its error reports name, and the lockfile.
    paths:
      - 'apps/web/**'
      - 'packages/core/src/**'
      - 'packages/db/src/**'
      - 'infra/src/config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.github/actions/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Tag (v0.x.y) or commit of master
        required: true
        default: master

permissions:
  contents: read

# One sync at a time, never cancelled halfway; GitHub keeps only the newest pending run.
concurrency:
  group: site
  cancel-in-progress: false

env:
  SITE: https://cronista.jcvstro.dev

jobs:
  # No secrets and no OIDC token: the dependencies install and the app builds here, away from the
  # AWS role.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: target
        uses: ./.github/actions/checkout-target
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/install-dependencies
        with:
          directory: target
          filter: '@cronista/web...'
      # A production build: production Supabase, the root version for error reports, no harness.
      - name: Build the app
        working-directory: target
        run: pnpm --filter @cronista/web build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: target/apps/web/dist
          if-no-files-found: error
          retention-days: 1

  # The app can depend on what the same commit changes in the backend (the CSP, the routes function,
  # a migration), which deploy.yml applies only after its plan is approved. So when that commit also
  # started deploy.yml, the front waits for it, and never ships if it failed. A job of its own, with
  # no environment and no OIDC token, so the deploy job's time is left for the freeze wait.
  backend:
    name: backend
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the backend deploy of the same commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          while :; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --commit "$SHA" \
              --event push --limit 1 --json status,conclusion --jq '.[0] // empty')
            if [ -z "$run" ]; then
              echo "No backend deploy for this commit."
              exit 0
            fi
            if [ "$(jq -r .status <<< "$run")" = completed ]; then
              conclusion=$(jq -r .conclusion <<< "$run")
              if [ "$conclusion" = success ]; then
                echo "The backend deploy of this commit succeeded."
                exit 0
              fi
              echo "::error::The backend deploy of this commit ended as $conclusion, so the front does not ship."
              exit 1
            fi
            sleep 60
          done

  # No dependencies installed: only GitHub's and AWS's actions, the AWS CLI and this repo's freeze
  # script run next to the token.
  deploy:
    name: deploy
    needs: [build, backend]
    runs-on: ubuntu-latest
    # The sync waits for the night freeze to end only when it ends within 5 hours.
    timeout-minutes: 315
    # The web role trusts only this environment, which accepts master alone.
    environment:
      name: production-web
      url: ${{ env.SITE }}
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      deployed: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Its step timeouts with no margin: unlike a CloudFormation update, a sync stops with its CLI.
      - name: Wait until the sync fits before a freeze
        run: node infra/scripts/wait-for-deploy-window.ts 15
      # After the wait: a re-run of an older run would roll the site back.
      - id: newest
        uses: ./.github/actions/newest-deploy-run
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.newest.outputs.newest == 'true'
        with:
          name: site
          path: ${{ runner.temp }}/site
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.newest.outputs.newest == 'true'
        timeout-minutes: 5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cronista-github-web
          aws-region: eu-west-1
          mask-aws-account-id: true
      # Hashed assets first, and never deleted here, so the pages already open keep theirs. Then
      # everything else, which browsers always revalidate: CloudFront keeps it only for the cache
      # policy's 1 s minimum TTL, so the new site shows with no invalidation. The filters keep the
      # hashed assets out of that second sync's deletions.
      - name: Sync the site
        if: steps.newest.outputs.newest == 'true'
        timeout-minutes: 5
        run: |
          bucket=$(aws cloudformation describe-stacks --stack-name CronistaEdge \
            --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text)
          echo "::add-mask::$bucket"
          test -n "$bucket"
          site="$RUNNER_TEMP/site"
          aws s3 sync "$site" "s3://$bucket" --only-show-errors \
            --exclude '*' --include 'assets/*' \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 sync "$site" "s3://$bucket" --only-show-errors --delete \
            --exclude 'assets/*' --cache-control 'no-cache'
      - name: Hash the uploaded index.html
        id: uploaded
        if: steps.newest.outputs.newest == 'true'
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/site/index.html" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        if: steps.newest.outputs.newest == 'true'
        timeout-minutes: 3
        uses: ./.github/actions/site-check
        with:
          expect: >-
            .root.status == 200
            and .root.sha256 == "${{ steps.uploaded.outputs.sha256 }}"
            and (.root.cacheControl | startswith("no-cache"))
            and (.root.contentType | startswith("text/html"))
      - name: Report the deploy
        if: steps.newest.outputs.newest == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "Deployed the front of v$VERSION: / serves the new index.html with no-cache." \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # A release marks the first deploy of a version, by this workflow or by deploy.yml.
  release:
    name: release
    needs: [build, deploy]
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/release-version
        with:
          version: ${{ needs.build.outputs.version }}
          sha: ${{ needs.build.outputs.sha }}
