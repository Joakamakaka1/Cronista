# Posts `cdk diff` against production on pull requests that can change the infrastructure
# (see docs/delivery.md). Advisory: it is not a required check.
# Public repo: never use pull_request_target. Fork PRs get no OIDC token, so the job skips them.
name: CDK diff

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'services/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cdk-diff.yml'

permissions:
  contents: read

concurrency:
  group: cdk-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cdk-diff:
    name: cdk-diff
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The account ID is a secret so it stays masked in the public logs.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cronista-github-readonly
          aws-region: eu-west-1
          mask-aws-account-id: true
      # Template method: the read-only role cannot create change sets. The CLI warns that it could
      # not assume the bootstrap roles and goes on with the read-only credentials.
      - name: Diff every stack
        working-directory: infra
        run: |
          set -o pipefail
          pnpm exec cdk diff --method=template --no-color 2>&1 \
            | sed -E 's/[0-9]{12}/<account>/g' | tee "$RUNNER_TEMP/diff.txt"
      - name: Post the diff as a single comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- cdk-diff -->'
          {
            echo "$marker"
            echo '### `cdk diff` against production'
            echo
            echo '```'
            # GitHub rejects comments over 65,536 characters.
            head -c 60000 "$RUNNER_TEMP/diff.txt"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          comments="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          id=$(gh api "$comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api "$comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          fi
