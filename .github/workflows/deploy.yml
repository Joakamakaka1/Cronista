# Deploys the backend and the infrastructure (see docs/delivery.md): a read-only plan, one approval,
# then the backup, the migrations, `cdk deploy`, a smoke test and the GitHub Release. The front
# deploys on its own, from deploy-web.yml.
# Public repo: the account ID is a secret, so GitHub masks it in every stack ARN and output.
name: Deploy

# A dispatch shows its mode and target; a push keeps its commit message. `newest-deploy-run`
# reads the `plan ` prefix to skip plan-only dispatches.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}', inputs.mode, inputs.ref) || '' }}

on:
  push:
    branches: [master]
    paths:
      - 'services/**'
      - 'packages/**'
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.github/actions/**'
      - '.github/workflows/deploy.yml'
  # Plans or applies any version in master's history: applying an older tag is the rollback.
  workflow_dispatch:
    inputs:
      ref:
        description: Tag (v0.x.y) or commit of master
        required: true
        default: master
      mode:
        description: plan only shows the changes; apply deploys them after the approval
        required: true
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

# One deploy at a time, never cancelled halfway. GitHub keeps only the newest pending run, which
# deploys every commit before it. A pending approval holds the group too; a plan-only dispatch gets
# its own, so it never waits behind one.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'plan' && format('plan-{0}', github.run_id) || 'prod' }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # Every stack except the owner-only ones (CronistaGitHubAccess, CronistaAuditTrail,
  # CronistaAccessAnalyzer-* and CronistaThreatDetection-*): the CLI has no exclude flag. It orders
  # them by their dependencies.
  STACKS: CronistaAccountGuards CronistaWebAcl CronistaDomain CronistaEdge CronistaWorkers
  # Older versions have no site check, which the smoke test invokes, and no geo restriction. Older
  # still, they fill the site bucket from CDK, which would overwrite and prune the front that
  # deploy-web.yml uploads.
  OLDEST_APPLICABLE_VERSION: 0.16.0

# Every job checks out the workflow's own commit at the root (actions, freeze rules) and the target,
# resolved once by `test`, into `target/`. Each job that changes production first waits until its
# step timeouts plus 30 minutes fit before the next freeze: a timeout kills the CLI but not a
# CloudFormation update or rollback already running, and the margin lets that finish.
jobs:
  # No secrets and no OIDC token: the test and lint tooling never runs next to a credential.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: target
        uses: ./.github/actions/checkout-target
        with:
          ref: ${{ inputs.ref || github.sha }}
          oldest-version: ${{ env.OLDEST_APPLICABLE_VERSION }}
          # A plan of an older version only warns that applying it would be refused.
          refuse-older: ${{ github.event_name == 'push' || inputs.mode == 'apply' }}
      - uses: ./.github/actions/install-dependencies
        with:
          directory: target
      - run: pnpm check
        working-directory: target

  # Read-only, so it needs no approval: the plan role reads the deployed templates and nothing else.
  # Change sets would need to write the CDK assets bucket, which a plan must not.
  plan-stacks:
    name: plan stacks
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-plan
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-target
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: ./.github/actions/install-dependencies
        with:
          directory: target
      # A run that a later one replaces asks for no approval.
      - id: newest
        uses: ./.github/actions/newest-deploy-run
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cronista-github-plan
          aws-region: eu-west-1
          mask-aws-account-id: true
      # The CLI warns that it could not assume the bootstrap roles and goes on with the plan role.
      # The default shell has no pipefail: without it a failed diff would pass through `tee`.
      - name: Diff the stacks against production
        working-directory: target/infra
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086 # STACKS is a list of stack names.
          pnpm exec cdk diff $STACKS --method=template --no-color 2>&1 \
            | sed -E 's/[0-9]{12}/<account>/g' | tee "$RUNNER_TEMP/diff.txt"
          {
            echo "### Stacks: v$VERSION against production"
            echo '```'
            # A step summary holds 1 MiB; the job log keeps the whole diff.
            head -c 500000 "$RUNNER_TEMP/diff.txt" | iconv -c -f utf-8 -t utf-8 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Read-only too: the token only lists the applied migrations, and only curl and jq run next to it.
  # `supabase db push --dry-run` would need a token that can write.
  plan-database:
    name: plan database
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-plan
    outputs:
      pending: ${{ steps.migrations.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/checkout-target
        with:
          ref: ${{ needs.test.outputs.sha }}
      - id: migrations
        name: List the migrations that would apply
        env:
          SUPABASE_MIGRATIONS_TOKEN: ${{ secrets.SUPABASE_MIGRATIONS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          set -o pipefail
          shopt -s nullglob
          dir=target/packages/db/supabase/migrations
          applied="$RUNNER_TEMP/applied.txt"
          curl -fsS --max-time 30 -H "Authorization: Bearer $SUPABASE_MIGRATIONS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/migrations" \
            | jq -r '(if type == "array" then . else .migrations end)[].version' | sort > "$applied"
          latest=$(tail -n 1 "$applied")
          pending=()
          out_of_order=()
          for file in "$dir"/*.sql; do
            name=$(basename "$file")
            timestamp=${name%%_*}
            if grep -qxF "$timestamp" "$applied"; then continue; fi
            pending+=("$name")
            if [[ "$timestamp" < "$latest" ]]; then out_of_order+=("$name"); fi
          done
          ahead=()
          while read -r timestamp; do
            files=("$dir/${timestamp}"_*.sql)
            if [ ${#files[@]} -eq 0 ]; then ahead+=("$timestamp"); fi
          done < "$applied"
          {
            echo "### Database: v$VERSION against production"
            echo "- To apply: ${pending[*]:-none}"
            echo "- Applied in production but not in this version (expected after a rollback): ${ahead[*]:-none}"
            if [ ${#out_of_order[@]} -gt 0 ]; then
              echo "- **Older than the last applied migration, which \`db push\` refuses: ${out_of_order[*]}**"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "pending=${#pending[@]}" >> "$GITHUB_OUTPUT"
          test ${#out_of_order[@]} -eq 0

  # The one approval: production-approval holds no secret, only the owner as required reviewer. The
  # credentials stay in `production`, which the nightly backup also uses with no approval.
  gate:
    name: approval
    needs: [test, plan-stacks, plan-database]
    if: (github.event_name == 'push' || inputs.mode == 'apply') && needs.plan-stacks.outputs.newest == 'true'
    runs-on: ubuntu-latest
    # A whole apply waits for the night freeze to end only when it ends within 5 hours.
    timeout-minutes: 310
    environment: production-approval
    permissions:
      actions: read
      contents: read
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub re-creates a deleted environment with no protection: then nobody approved this job.
      - name: Check that the environment still requires an approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rules=$(gh api "repos/$GH_REPO/environments/production-approval" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          test "$rules" -gt 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The dump and its restore check (15), its upload (5), the migrations (5), the stacks and the
      # smoke test (35), starting those jobs (15) and the margin (30): later jobs never wait out a
      # freeze halfway.
      - name: Wait until the whole apply fits before a freeze
        run: node infra/scripts/wait-for-deploy-window.ts 105
      # After every wait: a re-run of an older run, or a run that waited while a newer run was
      # queued, would roll production back. The newest run deploys every commit before it.
      - id: newest
        uses: ./.github/actions/newest-deploy-run

  # No `pnpm install`: no third-party JavaScript runs next to the token, or could swap the age
  # recipients the dump is encrypted to.
  backup:
    name: backup
    needs: gate
    if: needs.gate.outputs.newest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      artifact: ${{ steps.dump.outputs.artifact }}
      restore-check: ${{ steps.dump.outputs.restore-check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-supabase-cli
      - id: dump
        timeout-minutes: 15
        uses: ./.github/actions/dump-database
        with:
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          project-ref: ${{ secrets.SUPABASE_PROJECT_REF }}

  # No environment, so the OIDC token carries the master branch `sub` the backups role trusts.
  store-backup:
    name: store backup
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/store-backup
        with:
          artifact: ${{ needs.backup.outputs.artifact }}
          reason: pre-migration
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          bucket: ${{ secrets.DATA_BUCKET_NAME }}
          restore-check: ${{ needs.backup.outputs.restore-check }}

  # Runs only once the dump is in the bucket. No `pnpm install` either: only the pinned Supabase CLI
  # runs next to the token. It always runs, so `deploy` follows even with nothing to migrate.
  migrate:
    name: migrate
    needs: [test, plan-database, store-backup]
    runs-on: ubuntu-latest
    timeout-minutes: 315
    environment: production
    permissions:
      actions: read
      contents: read
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The migrations (5), starting `deploy` and the stacks (40) and the margin (30). Passes at once
      # after the gate's wait, unless the backup ran late or this job is re-run.
      - name: Wait until the migrations and the stacks fit before a freeze
        run: node infra/scripts/wait-for-deploy-window.ts 75
      - id: newest
        uses: ./.github/actions/newest-deploy-run
      # A rollback has nothing to apply, and `db push` refuses a remote history it lacks.
      - uses: ./.github/actions/checkout-target
        if: steps.newest.outputs.newest == 'true' && needs.plan-database.outputs.pending != '0'
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: ./.github/actions/setup-supabase-cli
        if: steps.newest.outputs.newest == 'true' && needs.plan-database.outputs.pending != '0'
      # The token signs in as Supabase's temporary login role: no database password. No `supabase
      # link`, which needs a token that can read the project's API keys, the secret one included.
      - name: Apply the database migrations
        if: steps.newest.outputs.newest == 'true' && needs.plan-database.outputs.pending != '0'
        timeout-minutes: 5
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase db push --project-ref "$SUPABASE_PROJECT_REF" --dry-run --workdir target/packages/db
          supabase db push --project-ref "$SUPABASE_PROJECT_REF" --yes --workdir target/packages/db
          echo "Applied the migrations the plan listed." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy
    needs: [test, migrate]
    if: needs.migrate.outputs.newest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    # Only a job in this environment, which accepts master alone, can assume the deploy role.
    environment:
      name: production
      url: https://cronista.jcvstro.dev
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      deployed: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The install (2), the credentials (5), the stacks (25), the smoke test (3) and the margin (30),
      # before installing anything, so the target's dependencies never run the freeze rules.
      - name: Wait until the stacks fit before a freeze
        run: node infra/scripts/wait-for-deploy-window.ts 65
      - id: newest
        uses: ./.github/actions/newest-deploy-run
      - uses: ./.github/actions/checkout-target
        if: steps.newest.outputs.newest == 'true'
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: ./.github/actions/install-dependencies
        if: steps.newest.outputs.newest == 'true'
        with:
          directory: target
      # After the wait: the role session lasts one hour.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.newest.outputs.newest == 'true'
        timeout-minutes: 5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cronista-github-deploy
          aws-region: eu-west-1
          mask-aws-account-id: true
      # Through change sets, never `--hotswap`.
      - name: Deploy the stacks
        if: steps.newest.outputs.newest == 'true'
        timeout-minutes: 25
        working-directory: target/infra
        run: |
          # shellcheck disable=SC2086 # STACKS is a list of stack names.
          pnpm exec cdk deploy $STACKS --require-approval never --no-color --progress events
      # Read-only, so outside the wait. A 401 from each API proves the whole path: CloudFront,
      # origin access control, the Lambda and its session check.
      - name: Smoke test
        if: steps.newest.outputs.newest == 'true'
        timeout-minutes: 3
        uses: ./.github/actions/site-check
        with:
          expect: .root.status == 200 and .me.status == 401 and .hint.status == 401
      - name: Report the deploy
        if: steps.newest.outputs.newest == 'true'
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: echo "Deployed v$VERSION; the smoke test passed." >> "$GITHUB_STEP_SUMMARY"

  # A release marks the first deploy of a version, by this workflow or by deploy-web.yml.
  release:
    name: release
    needs: [test, deploy]
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/release-version
        with:
          version: ${{ needs.test.outputs.version }}
          sha: ${{ needs.test.outputs.sha }}
