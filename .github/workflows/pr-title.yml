# Required check: the PR title becomes the squash commit on master (see docs/delivery.md).
# Public repo: never use pull_request_target. The title is untrusted input: it only reaches the script
# through an environment variable, never interpolated into the shell.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .node-version
            .claude/hooks/src
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .claude/hooks/src/pr-title.ts
