# Required checks for every PR to master (see docs/delivery.md).
# Public repo: never use pull_request_target, and no job here gets secrets or AWS roles.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  code:
    name: code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Migrations apply from scratch, pgTAP passes, the committed types match and no migration is destructive.
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Same version as local: generated types differ between CLI releases.
      SUPABASE_CLI_VERSION: 2.122.0
      # SHA-256 of supabase_<version>_linux_amd64.tar.gz; update both together.
      SUPABASE_CLI_SHA256: 59ed066847b98d7461c60e9109d40cab6b9756177ce06ebb05b51338519f5136
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @cronista/db
      - name: Lint migrations (Squawk)
        run: pnpm --filter @cronista/db lint:sql
      - name: Install the Supabase CLI (pinned checksum)
        run: |
          tarball="supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/$tarball"
          echo "${SUPABASE_CLI_SHA256}  $tarball" | sha256sum --check
          tar -xzf "$tarball" supabase supabase-go
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: supabase db start --workdir packages/db
      - run: supabase db reset --workdir packages/db
      - run: supabase test db --workdir packages/db
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local --workdir packages/db > packages/db/src/database.types.ts
          git diff --exit-code -- packages/db/src/database.types.ts

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "$tarball" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml .
