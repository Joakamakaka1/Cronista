# Required checks for every PR to master (see docs/delivery.md).
# Public repo: never use pull_request_target, and no job here gets secrets or AWS roles.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  code:
    name: code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
      - run: pnpm check

  # Migrations apply from scratch, pgTAP and the game engine's tests pass, the committed types match and
  # no migration is destructive. The engine reaches the database through the Data API, as it does in
  # production, and `supabase status` shows the local keys only with Auth running.
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
        with:
          # The MCP server's tests play days through the engine, so this brings both.
          filter: '@cronista/memory-mcp...'
      - name: Lint migrations (Squawk)
        run: pnpm --filter @cronista/db lint:sql
      - uses: ./.github/actions/setup-supabase-cli
      - run: supabase start --workdir packages/db -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      - run: supabase db reset --workdir packages/db
      - run: supabase test db --workdir packages/db
      - name: Game engine against the database
        run: pnpm --filter @cronista/engine test:db
      - name: MCP server against the database
        run: pnpm --filter @cronista/memory-mcp test:db
      - name: Generated types are up to date
        run: |
          pnpm --filter @cronista/db types
          git diff --exit-code -- packages/db/src/database.types.ts

  # Every module is formatted, valid and matches its lock file. This needs no state and no credentials.
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-terraform
      - run: terraform fmt -check -recursive terraform
      - name: Validate each module
        run: |
          for module in terraform/*/; do
            terraform -chdir="$module" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$module" validate
          done

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "$tarball" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml .
