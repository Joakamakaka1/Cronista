# Required checks for every PR to master (see docs/delivery.md).
# Public repo: never use pull_request_target, and no job here gets secrets or AWS roles.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  code:
    name: code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
      - run: pnpm check

  # Migrations apply from scratch, pgTAP passes, the committed types match and no migration is destructive.
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
        with:
          filter: '@cronista/db'
      - name: Lint migrations (Squawk)
        run: pnpm --filter @cronista/db lint:sql
      - uses: ./.github/actions/setup-supabase-cli
      - run: supabase db start --workdir packages/db
      - run: supabase db reset --workdir packages/db
      - run: supabase test db --workdir packages/db
      - name: Generated types are up to date
        run: |
          pnpm --filter @cronista/db types
          git diff --exit-code -- packages/db/src/database.types.ts

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "$tarball" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml .
