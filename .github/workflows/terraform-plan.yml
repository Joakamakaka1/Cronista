# Posts `terraform plan` of terraform/github on the pull requests that change it (see docs/delivery.md).
# Advisory: it is not a required check. Nothing in CI applies: `apply` runs on the owner's machine.
# Public repo: never use pull_request_target. Fork PRs get no secrets or OIDC token, so the job skips them.
name: Terraform plan

on:
  pull_request:
    paths:
      - 'terraform/github/**'
      - '.github/actions/setup-terraform/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform-plan:
    name: terraform-plan
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs the PR's code with a read-only AWS role, so it gets no write token: `comment` posts.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-terraform
      # The account ID is a secret so it stays masked in the public logs.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cronista-github-readonly
          aws-region: eu-west-1
          mask-aws-account-id: true
      - name: Plan the code against the state
        working-directory: terraform/github
        env:
          STATE_BUCKET: ${{ secrets.DATA_BUCKET_NAME }}
        # No refresh: GitHub hides the merge settings from a read-only token, which reads as false
        # changes, so this compares the PR with the last apply and needs no GitHub credentials. The
        # plan before each `apply` sees what changed by hand. No lock: this role cannot write the lock
        # file, and a plan changes nothing. GitHub masks secrets in logs, not in comments, so the
        # output drops the bucket and any account ID.
        run: |
          set -o pipefail
          terraform init -input=false -no-color -lockfile=readonly -backend-config="bucket=$STATE_BUCKET"
          terraform plan -input=false -no-color -lock=false -refresh=false -out="$RUNNER_TEMP/github.tfplan" > /dev/null
          terraform show -no-color "$RUNNER_TEMP/github.tfplan" \
            | sed -E -e "s/$STATE_BUCKET/<bucket>/g" -e 's/[0-9]{12}/<account>/g' | tee "$RUNNER_TEMP/plan.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: terraform-plan
          path: ${{ runner.temp }}/plan.txt
          if-no-files-found: ignore
          retention-days: 1

  # Also after a failed plan, so the comment never keeps showing an older commit's plan. It runs no
  # code from the PR, which a shared local action would.
  comment:
    name: terraform-plan comment
    needs: terraform-plan
    if: ${{ !cancelled() && needs.terraform-plan.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: terraform-plan
          path: ${{ runner.temp }}
      - name: Post the plan as a single comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAN_RESULT: ${{ needs.terraform-plan.result }}
        run: |
          marker='<!-- terraform-plan -->'
          # GitHub rejects comments over 65,536 characters.
          limit=60000
          touch "$RUNNER_TEMP/plan.txt"
          {
            echo "$marker"
            echo "### \`terraform plan\` of \`terraform/github\` for $HEAD_SHA"
            echo
            if [ "$PLAN_RESULT" != success ]; then
              echo "**The plan failed ($PLAN_RESULT): see the job log.**"
              echo
            fi
            echo '```'
            # iconv drops a multi-byte character the byte cut leaves half written (and exits 1).
            head -c "$limit" "$RUNNER_TEMP/plan.txt" | iconv -c -f utf-8 -t utf-8 || true
            echo '```'
            if [ "$(wc -c < "$RUNNER_TEMP/plan.txt")" -gt "$limit" ]; then
              echo '_Truncated: the full plan is in the job log._'
            fi
          } > "$RUNNER_TEMP/comment.md"
          comments="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          id=$(gh api "$comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api "$comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          fi
